<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ws://127.0.0.1:8765">
  <title>Cletus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-idle">
  <div id="hud">
    <div id="drag-region"></div>
    <div id="state-label">IDLE</div>
    <div id="voice-status" class="offline" title="Voice service offline">● VOICE</div>
    <div id="followup" class="hidden" title="Mic is open, just talk">● GO AHEAD <span id="followup-count"></span></div>
    <button id="close-btn" title="Close">×</button>

    <div id="dialog">
      <div id="you-said" class="line"></div>
      <div id="cletus-said" class="line"></div>
    </div>

    <div id="scene">
      <svg viewBox="0 0 720 456" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

        <defs>
          <!-- ============ ATMOSPHERE ============ -->
          <radialGradient id="bg-glow" cx="50%" cy="42%" r="72%">
            <stop offset="0%"   stop-color="#0a3d5a" stop-opacity="0.95"/>
            <stop offset="45%"  stop-color="#04121f" stop-opacity="1"/>
            <stop offset="100%" stop-color="#00050a" stop-opacity="1"/>
          </radialGradient>

          <radialGradient id="vignette" cx="50%" cy="48%" r="68%">
            <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
          </radialGradient>

          <pattern id="pcb-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0a3a55" stroke-width="0.35" opacity="0.5"/>
            <circle cx="0" cy="0" r="0.8" fill="#12b5e5" opacity="0.3"/>
          </pattern>

          <!-- ============ SHADOWS (gradient-based, cheap, no filter cost) ============ -->
          <radialGradient id="shadow-soft" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#000000" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#000208" stop-opacity="0.42"/>
            <stop offset="100%" stop-color="#000208" stop-opacity="0"/>
          </radialGradient>

          <radialGradient id="shadow-contact" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#000000" stop-opacity="0.95"/>
            <stop offset="40%"  stop-color="#000000" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="wall-shadow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </linearGradient>

          <!-- ============ SURFACES ============ -->
          <!-- Desk top: lit from the monitors (far edge) falling off toward the viewer -->
          <linearGradient id="desk-top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0d4a68" stop-opacity="0.95"/>
            <stop offset="45%"  stop-color="#052839" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#01111c" stop-opacity="0.98"/>
          </linearGradient>

          <linearGradient id="desk-front" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#03202f" stop-opacity="1"/>
            <stop offset="100%" stop-color="#000a12" stop-opacity="1"/>
          </linearGradient>

          <linearGradient id="screen-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#06304a" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#010d18" stop-opacity="0.95"/>
          </linearGradient>

          <!-- Emissive halo each monitor throws into the room -->
          <radialGradient id="screen-emit" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#3ee0ff" stop-opacity="0.30"/>
            <stop offset="60%"  stop-color="#12b5e5" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#12b5e5" stop-opacity="0"/>
          </radialGradient>

          <!-- Volumetric spill from screen down onto the desk -->
          <linearGradient id="light-cone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#3ee0ff" stop-opacity="0.20"/>
            <stop offset="70%"  stop-color="#3ee0ff" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#3ee0ff" stop-opacity="0"/>
          </linearGradient>

          <!-- Rim light: monitors are in front of him, so his silhouette edges catch it -->
          <linearGradient id="rim-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#7fe9ff" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#2aa8d8" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0a4d70" stop-opacity="0.10"/>
          </linearGradient>

          <!-- Body fill: dark core so contour lines read as sitting ON a mass -->
          <linearGradient id="body-mass" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%"   stop-color="#04283c" stop-opacity="0.88"/>
            <stop offset="55%"  stop-color="#021724" stop-opacity="0.92"/>
            <stop offset="100%" stop-color="#000a12" stop-opacity="0.95"/>
          </linearGradient>

          <linearGradient id="chair-mass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#020e18" stop-opacity="0.96"/>
            <stop offset="50%"  stop-color="#041c2b" stop-opacity="0.96"/>
            <stop offset="100%" stop-color="#01090f" stop-opacity="0.96"/>
          </linearGradient>

          <!-- CRT scanlines -->
          <pattern id="scanlines" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
            <rect width="2" height="1.2" fill="#000000" opacity="0.30"/>
          </pattern>

          <!-- ============ FILTERS (small regions only, for cost) ============ -->
          <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <filter id="glow-strong" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <filter id="glow-body" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <!-- Clip so screen content can scroll without escaping the bezel -->
          <clipPath id="clip-screen"><rect x="8" y="8" width="140" height="78" rx="1.5"/></clipPath>
        </defs>

        <!-- ================= 1. BACKGROUND ================= -->
        <rect width="720" height="456" fill="url(#bg-glow)"/>
        <rect width="720" height="456" fill="url(#pcb-grid)" opacity="0.65"/>

        <!-- ================= 2. PCB TRACES ================= -->
        <g id="pcb-traces" stroke="#0f7ea8" stroke-width="0.8" fill="none" opacity="0.5" filter="url(#glow-soft)">
          <path id="trace-1" d="M 20 40 L 120 40 L 140 60 L 140 130 L 90 130 L 70 150"/>
          <path id="trace-2" d="M 700 60 L 600 60 L 580 80 L 580 140 L 640 140"/>
          <path id="trace-3" d="M 40 420 L 40 340 L 90 340 L 110 320 L 200 320"/>
          <path id="trace-4" d="M 680 420 L 680 350 L 620 350 L 600 330 L 520 330"/>
          <path id="trace-5" d="M 360 20 L 360 60"/>
          <circle cx="20" cy="40"  r="2.4" fill="#12b5e5"/>
          <circle cx="70" cy="150" r="2.4" fill="#12b5e5"/>
          <circle cx="700" cy="60" r="2.4" fill="#12b5e5"/>
          <circle cx="640" cy="140" r="2.4" fill="#12b5e5"/>
          <circle cx="40" cy="420" r="2.4" fill="#12b5e5"/>
          <circle cx="200" cy="320" r="2.4" fill="#12b5e5"/>
          <circle cx="680" cy="420" r="2.4" fill="#12b5e5"/>
          <circle cx="520" cy="330" r="2.4" fill="#12b5e5"/>
        </g>

        <g id="pcb-signals" filter="url(#glow-strong)">
          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#trace-1"/></animateMotion>
          </circle>
          <circle r="1.5" fill="#7fffb9" opacity="0.85">
            <animateMotion dur="5.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#trace-1"/></animateMotion>
          </circle>
          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#trace-2"/></animateMotion>
          </circle>
          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#trace-3"/></animateMotion>
          </circle>
          <circle r="1.4" fill="#ffb547" opacity="0.85">
            <animateMotion dur="6.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#trace-3"/></animateMotion>
          </circle>
          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#trace-4"/></animateMotion>
          </circle>
          <circle r="1.6" fill="#3ee0ff" opacity="0.9">
            <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#trace-5"/></animateMotion>
          </circle>
        </g>

        <!-- ================= 3. WALL BLOOM + MONITOR CAST SHADOWS ================= -->
        <ellipse id="wall-bloom" cx="360" cy="200" rx="330" ry="86" fill="url(#screen-emit)"/>

        <!-- each monitor drops a soft shadow onto the wall beneath it -->
        <g id="wall-shadows" opacity="0.85">
          <rect x="44"  y="228" width="144" height="26" fill="url(#wall-shadow)"/>
          <rect x="212" y="228" width="144" height="26" fill="url(#wall-shadow)"/>
          <rect x="380" y="228" width="144" height="26" fill="url(#wall-shadow)"/>
          <rect x="548" y="228" width="144" height="26" fill="url(#wall-shadow)"/>
        </g>

        <g id="monitor-arc">

            <rect x="5" y="5" width="146" height="84" rx="2" fill="#01090f" stroke="#0a4d70" stroke-width="0.6"/>
            <rect class="screen" x="8" y="8" width="140" height="78" rx="1.5" fill="url(#screen-fade)" stroke="#0e7aa6" stroke-width="0.35"/>
            <g clip-path="url(#clip-screen)">

                <rect x="12" y="62" width="28" height="1" fill="#0f7ea8" opacity="0.4"/>
                <rect x="12" y="72" width="46" height="1" fill="#0f7ea8" opacity="0.35"/>
                <rect x="12" y="82" width="30" height="1" fill="#0f7ea8" opacity="0.4"/>
              </g>
            </g>
            <rect x="8" y="8" width="140" height="6" fill="#04202f" opacity="0.9"/>
            <circle cx="14" cy="11" r="1.1" fill="#ff5a6a" opacity="0.85"/>
            <circle cx="19" cy="11" r="1.1" fill="#ffb547" opacity="0.85"/>
            <circle cx="24" cy="11" r="1.1" fill="#3ee0ff" opacity="0.85"/>

            <text class="tag" x="146" y="22" text-anchor="end" fill="#ffb547" font-size="5" letter-spacing="1" font-family="Consolas, monospace">PRE-LAUNCH</text>
            <text x="78" y="52" text-anchor="middle" fill="#a8e6ff" font-size="24" font-weight="bold" font-family="Consolas, monospace">0</text>
            <text x="78" y="63" text-anchor="middle" fill="#0f7ea8" font-size="5" letter-spacing="2.5" font-family="Consolas, monospace">SUBSCRIBERS</text>
            <g class="eq-bars">
              <rect x="14"  y="78" width="5" height="4"/><rect x="22" y="78" width="5" height="4"/>
              <rect x="30"  y="78" width="5" height="4"/><rect x="38" y="78" width="5" height="4"/>
              <rect x="46"  y="78" width="5" height="4"/><rect x="54" y="78" width="5" height="4"/>
              <rect x="62"  y="78" width="5" height="4"/><rect x="70" y="78" width="5" height="4"/>

              <rect x="126" y="78" width="5" height="4"/><rect x="134" y="78" width="5" height="4"/>
            </g>
            <rect class="scan" x="8" y="8" width="140" height="78" fill="url(#scanlines)" opacity="0.5"/>
            <rect class="sweep" x="8" y="8" width="140" height="12" fill="#7fe9ff" opacity="0"/>
            <circle cx="150" cy="89" r="1" fill="#3ee0ff" opacity="0.9"/>
          </g>

          <!-- monitor 2: Unshackled -->
          <g class="monitor mon-2" transform="translate(206 132)">
            <ellipse class="emit" cx="78" cy="47" rx="120" ry="70" fill="url(#screen-emit)"/>

            <rect x="1.5" y="2.5" width="156" height="94" rx="3" fill="#000000" opacity="0.55"/>
            <rect class="bezel" x="0" y="0" width="156" height="94" rx="3" fill="#061420" stroke="#12b5e5" stroke-width="1.4"/>
            <rect x="5" y="5" width="146" height="84" rx="2" fill="#01090f" stroke="#0a4d70" stroke-width="0.6"/>
