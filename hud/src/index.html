<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ws://127.0.0.1:8765">
  <title>Cletus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-idle">
  <div id="hud">
    <div id="drag-region"></div>
    <div id="state-label">IDLE</div>
    <div id="voice-status" class="offline" title="Voice service offline">● VOICE</div>
    <div id="followup" class="hidden" title="Mic is open, just talk">● GO AHEAD <span id="followup-count"></span></div>
    <button id="close-btn" title="Close">×</button>

    <div id="dialog">
      <div id="you-said" class="line"></div>
      <div id="cletus-said" class="line"></div>
    </div>

    <div id="scene">
      <svg viewBox="0 0 720 456" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

        <defs>
          <radialGradient id="bg-glow" cx="50%" cy="55%" r="70%">
            <stop offset="0%"  stop-color="#08324a" stop-opacity="0.9"/>
            <stop offset="55%" stop-color="#04101c" stop-opacity="1"/>
            <stop offset="100%" stop-color="#010509" stop-opacity="1"/>
          </radialGradient>

          <pattern id="pcb-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0a3a55" stroke-width="0.35" opacity="0.55"/>
            <circle cx="0" cy="0" r="0.8" fill="#12b5e5" opacity="0.35"/>
          </pattern>

          <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.6" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="glow-strong" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <linearGradient id="screen-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#052538" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#010b14" stop-opacity="0.95"/>
          </linearGradient>
        </defs>

        <!-- background layers -->
        <rect width="720" height="456" fill="url(#bg-glow)"/>
        <rect width="720" height="456" fill="url(#pcb-grid)" opacity="0.7"/>

        <!-- animated PCB traces: static line + flowing signal packets -->
        <g id="pcb-traces" stroke="#0f7ea8" stroke-width="0.8" fill="none" opacity="0.55" filter="url(#glow-soft)">
          <path id="trace-1" d="M 20 40 L 120 40 L 140 60 L 140 130 L 90 130 L 70 150"/>
          <path id="trace-2" d="M 700 60 L 600 60 L 580 80 L 580 140 L 640 140"/>
          <path id="trace-3" d="M 40 420 L 40 340 L 90 340 L 110 320 L 200 320"/>
          <path id="trace-4" d="M 680 420 L 680 350 L 620 350 L 600 330 L 520 330"/>
          <path id="trace-5" d="M 360 20 L 360 60"/>
          <!-- node terminals -->
          <circle cx="20" cy="40"  r="2.4" fill="#12b5e5"/>
          <circle cx="70" cy="150" r="2.4" fill="#12b5e5"/>
          <circle cx="700" cy="60" r="2.4" fill="#12b5e5"/>
          <circle cx="640" cy="140" r="2.4" fill="#12b5e5"/>
          <circle cx="40" cy="420" r="2.4" fill="#12b5e5"/>
          <circle cx="200" cy="320" r="2.4" fill="#12b5e5"/>
          <circle cx="680" cy="420" r="2.4" fill="#12b5e5"/>
          <circle cx="520" cy="330" r="2.4" fill="#12b5e5"/>
        </g>

        <!-- signal packets flowing down each trace (outside pcb-traces group so glow is independent) -->
        <g id="pcb-signals" filter="url(#glow-strong)">
          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.2s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-1"/>
            </animateMotion>
          </circle>
          <circle r="1.5" fill="#7fffb9" opacity="0.85">
            <animateMotion dur="5.6s" begin="1.4s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-1"/>
            </animateMotion>
          </circle>

          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="3.6s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-2"/>
            </animateMotion>
          </circle>

          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.8s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-3"/>
            </animateMotion>
          </circle>
          <circle r="1.4" fill="#ffb547" opacity="0.85">
            <animateMotion dur="6.2s" begin="2.1s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-3"/>
            </animateMotion>
          </circle>

          <circle r="1.9" fill="#3ee0ff" opacity="0.95">
            <animateMotion dur="4.4s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-4"/>
            </animateMotion>
          </circle>

          <circle r="1.6" fill="#3ee0ff" opacity="0.9">
            <animateMotion dur="2.4s" repeatCount="indefinite" rotate="0">
              <mpath href="#trace-5"/>
            </animateMotion>
          </circle>
        </g>

        <!-- monitor bank: 4 wall-mounted monitors, equal size, no overlap, real bezel + stand-arm structure -->
        <g id="monitor-arc" filter="url(#glow-soft)">
          <!-- wall-mount rail (horizontal bracket bar behind the monitor row) -->
          <rect x="24" y="112" width="672" height="4" rx="1" fill="#031824" stroke="#0f7ea8" stroke-width="0.6" opacity="0.85"/>
          <rect x="24" y="116" width="672" height="2" fill="#010a12" opacity="0.9"/>

          <!-- monitor 1 -->
          <g class="monitor mon-1" transform="translate(38 132)">
            <!-- mount arm from rail to bezel top -->
            <line x1="78" y1="-20" x2="78" y2="0" stroke="#0f7ea8" stroke-width="1.4"/>
            <rect x="72" y="-22" width="12" height="4" rx="1" fill="#052538" stroke="#0f7ea8" stroke-width="0.6"/>
            <!-- outer bezel -->
            <rect x="0" y="0" width="156" height="94" rx="3" fill="#050f18" stroke="#12b5e5" stroke-width="1.4"/>
            <!-- bezel inner shadow (recessed screen ring) -->
            <rect x="5" y="5" width="146" height="84" rx="2" fill="#010810" stroke="#0a4d70" stroke-width="0.6"/>
            <!-- actual screen surface -->
            <rect class="screen" x="8" y="8" width="140" height="78" rx="1.5" fill="url(#screen-fade)" stroke="#0e7aa6" stroke-width="0.35"/>
            <!-- top status bar hint -->
            <rect x="8" y="8" width="140" height="6" fill="#041624" opacity="0.85"/>
            <circle cx="14" cy="11" r="1.1" fill="#ff5a6a" opacity="0.85"/>
            <circle cx="19" cy="11" r="1.1" fill="#ffb547" opacity="0.85"/>
            <circle cx="24" cy="11" r="1.1" fill="#3ee0ff" opacity="0.85"/>
            <!-- placeholder label -->
            <!-- content: NurseTrack / subscribers -->
            <text x="12" y="22" fill="#3ee0ff" font-size="6" letter-spacing="1.4" font-family="Consolas, monospace" font-weight="bold">NURSETRACK</text>
            <text x="146" y="22" text-anchor="end" fill="#ffb547" font-size="5" letter-spacing="1" font-family="Consolas, monospace">PRE-LAUNCH</text>
            <text x="78" y="52" text-anchor="middle" fill="#a8e6ff" font-size="24" font-weight="bold" font-family="Consolas, monospace">0</text>
            <text x="78" y="63" text-anchor="middle" fill="#0f7ea8" font-size="5" letter-spacing="2.5" font-family="Consolas, monospace">SUBSCRIBERS</text>
            <line x1="14" y1="82" x2="144" y2="82" stroke="#0a4d70" stroke-width="0.3" opacity="0.55"/>
            <polyline points="14,80 25,80 36,80 47,80 58,80 69,80 80,80 91,80 102,80 113,80 124,80 135,80 144,80" stroke="#0f7ea8" stroke-width="0.6" fill="none" opacity="0.7"/>
            <!-- power indicator -->
            <circle cx="150" cy="89" r="1" fill="#3ee0ff" opacity="0.9"/>
          </g>

          <!-- monitor 2 -->
          <g class="monitor mon-2" transform="translate(206 132)">
            <line x1="78" y1="-20" x2="78" y2="0" stroke="#0f7ea8" stroke-width="1.4"/>
            <rect x="72" y="-22" width="12" height="4" rx="1" fill="#052538" stroke="#0f7ea8" stroke-width="0.6"/>
            <rect x="0" y="0" width="156" height="94" rx="3" fill="#050f18" stroke="#12b5e5" stroke-width="1.4"/>
            <rect x="5" y="5" width="146" height="84" rx="2" fill="#010810" stroke="#0a4d70" stroke-width="0.6"/>
            <rect class="screen" x="8" y="8" width="140" height="78" rx="1.5" fill="url(#screen-fade)" stroke="#0e7aa6" stroke-width="0.35"/>
            <rect x="8" y="8" width="140" height="6" fill="#041624" opacity="0.85"/>
            <circle cx="14" cy="11" r="1.1" fill="#ff5a6a" opacity="0.85"/>
            <circle cx="19" cy="11" r="1.1" fill="#ffb547" opacity="0.85"/>
            <circle cx="24" cy="11" r="1.1" fill="#3ee0ff" opacity="0.85"/>
            <!-- content: Unshackled Truth / followers -->
            <text x="12" y="22" fill="#3ee0ff" font-size="6" letter-spacing="1.4" font-family="Consolas, monospace" font-weight="bold">UNSHACKLED</text>
            <text x="146" y="22" text-anchor="end" fill="#7fffb9" font-size="5" letter-spacing="1" font-family="Consolas, monospace">LIVE</text>
            <text x="78" y="52" text-anchor="middle" fill="#a8e6ff" font-size="24" font-weight="bold" font-family="Consolas, monospace">—</text>
            <text x="78" y="63" text-anchor="middle" fill="#0f7ea8" font-size="5" letter-spacing="2.5" font-family="Consolas, monospace">FOLLOWERS</text>
            <line x1="14" y1="82" x2="144" y2="82" stroke="#0a4d70" stroke-width="0.3" opacity="0.55"/>
            <polyline points="14,80 25,79 36,80 47,77 58,76 69,74 80,75 91,72 102,71 113,69 124,70 135,67 144,66" stroke="#3ee0ff" stroke-width="0.8" fill="none" opacity="0.85"/>
            <circle cx="150" cy="89" r="1" fill="#3ee0ff" opacity="0.9"/>
          </g>

          <!-- monitor 3 -->
          <g class="monitor mon-3" transform="translate(374 132)">
            <line x1="78" y1="-20" x2="78" y2="0" stroke="#0f7ea8" stroke-width="1.4"/>
            <rect x="72" y="-22" width="12" height="4" rx="1" fill="#052538" stroke="#0f7ea8" stroke-width="0.6"/>
            <rect x="0" y="0" width="156" height="94" rx="3" fill="#050f18" stroke="#12b5e5" stroke-width="1.4"/>
            <rect x="5" y="5" width="146" height="84" rx="2" fill="#010810" stroke="#0a4d70" stroke-width="0.6"/>
            <rect class="screen" x="8" y="8" width="140" height="78" rx="1.5" fill="url(#screen-fade)" stroke="#0e7aa6" stroke-width="0.35"/>
            <rect x="8" y="8" width="140" height="6" fill="#041624" opacity="0.85"/>
            <circle cx="14" cy="11" r="1.1" fill="#ff5a6a" opacity="0.85"/>
            <circle cx="19" cy="11" r="1.1" fill="#ffb547" opacity="0.85"/>
            <circle cx="24" cy="11" r="1.1" fill="#3ee0ff" opacity="0.85"/>
            <!-- content: Wendell Turner / leads -->
            <text x="12" y="22" fill="#3ee0ff" font-size="6" letter-spacing="1.4" font-family="Consolas, monospace" font-weight="bold">WENDELL TURNER</text>
            <text x="146" y="22" text-anchor="end" fill="#ffb547" font-size="5" letter-spacing="1" font-family="Consolas, monospace">6MO TARGET</text>
            <text x="78" y="52" text-anchor="middle" fill="#a8e6ff" font-size="24" font-weight="bold" font-family="Consolas, monospace" class="wendell-num">0<tspan fill="#0f7ea8" font-size="13">/3</tspan></text>
            <text x="78" y="63" text-anchor="middle" fill="#0f7ea8" font-size="5" letter-spacing="2.5" font-family="Consolas, monospace">LEADS</text>
            <rect x="14" y="76" width="130" height="4" rx="0.5" fill="#010810" stroke="#0a4d70" stroke-width="0.3"/>
            <rect x="14" y="76" width="0" height="4" fill="#3ee0ff" opacity="0.7"/>
            <text x="14" y="88" fill="#0f7ea8" font-size="4" letter-spacing="1" font-family="Consolas, monospace" opacity="0.65">0 / 6 MO</text>
            <text x="144" y="88" text-anchor="end" fill="#0f7ea8" font-size="4" letter-spacing="1" font-family="Consolas, monospace" opacity="0.65">TARGET 3</text>
            <circle cx="150" cy="89" r="1" fill="#3ee0ff" opacity="0.9"/>

            <!-- SPEAKING waveform overlay: 24 vertical bars, animated -->
            <g class="waveform-overlay">
              <rect class="wf-bar" x="14"  y="42" width="4.5" height="12"/>
              <rect class="wf-bar" x="20"  y="38" width="4.5" height="20"/>
              <rect class="wf-bar" x="26"  y="34" width="4.5" height="28"/>
              <rect class="wf-bar" x="32"  y="30" width="4.5" height="36"/>
              <rect class="wf-bar" x="38"  y="36" width="4.5" height="24"/>
              <rect class="wf-bar" x="44"  y="40" width="4.5" height="16"/>
              <rect class="wf-bar" x="50"  y="32" width="4.5" height="32"/>
              <rect class="wf-bar" x="56"  y="28" width="4.5" height="40"/>
              <rect class="wf-bar" x="62"  y="34" width="4.5" height="28"/>
              <rect class="wf-bar" x="68"  y="38" width="4.5" height="20"/>
              <rect class="wf-bar" x="74"  y="30" width="4.5" height="36"/>
              <rect class="wf-bar" x="80"  y="26" width="4.5" height="44"/>
              <rect class="wf-bar" x="86"  y="32" width="4.5" height="32"/>
              <rect class="wf-bar" x="92"  y="36" width="4.5" height="24"/>
              <rect class="wf-bar" x="98"  y="34" width="4.5" height="28"/>
              <rect class="wf-bar" x="104" y="40" width="4.5" height="16"/>
              <rect class="wf-bar" x="110" y="30" width="4.5" height="36"/>
              <rect class="wf-bar" x="116" y="36" width="4.5" height="24"/>
              <rect class="wf-bar" x="122" y="38" width="4.5" height="20"/>
              <rect class="wf-bar" x="128" y="42" width="4.5" height="12"/>
              <rect class="wf-bar" x="134" y="40" width="4.5" height="16"/>
              <rect class="wf-bar" x="140" y="44" width="4.5" height="8"/>
            </g>
          </g>

          <!-- monitor 4 -->
          <g class="monitor mon-4" transform="translate(542 132)">
            <line x1="78" y1="-20" x2="78" y2="0" stroke="#0f7ea8" stroke-width="1.4"/>
            <rect x="72" y="-22" width="12" height="4" rx="1" fill="#052538" stroke="#0f7ea8" stroke-width="0.6"/>
            <rect x="0" y="0" width="156" height="94" rx="3" fill="#050f18" stroke="#12b5e5" stroke-width="1.4"/>
            <rect x="5" y="5" width="146" height="84" rx="2" fill="#010810" stroke="#0a4d70" stroke-width="0.6"/>
            <rect class="screen" x="8" y="8" width="140" height="78" rx="1.5" fill="url(#screen-fade)" stroke="#0e7aa6" stroke-width="0.35"/>
            <rect x="8" y="8" width="140" height="6" fill="#041624" opacity="0.85"/>
            <circle cx="14" cy="11" r="1.1" fill="#ff5a6a" opacity="0.85"/>
            <circle cx="19" cy="11" r="1.1" fill="#ffb547" opacity="0.85"/>
            <circle cx="24" cy="11" r="1.1" fill="#3ee0ff" opacity="0.85"/>
            <!-- content: kelly.dev / NOW WORKING ON -->
            <text x="12" y="22" fill="#3ee0ff" font-size="6" letter-spacing="1.4" font-family="Consolas, monospace" font-weight="bold">KELLY.DEV</text>
            <text x="146" y="22" text-anchor="end" fill="#7fffb9" font-size="5" letter-spacing="1" font-family="Consolas, monospace">ACTIVE</text>
            <text x="78" y="40" text-anchor="middle" fill="#0f7ea8" font-size="5" letter-spacing="3" font-family="Consolas, monospace">NOW WORKING ON</text>
            <text x="78" y="60" text-anchor="middle" fill="#a8e6ff" font-size="14" font-weight="bold" letter-spacing="1" font-family="Consolas, monospace">CLETUS HUD</text>
            <circle cx="78" cy="74" r="2" fill="#7fffb9" opacity="0.9">
              <animate attributeName="opacity" values="0.9;0.25;0.9" dur="1.6s" repeatCount="indefinite"/>
              <animate attributeName="r" values="2;2.6;2" dur="1.6s" repeatCount="indefinite"/>
            </circle>
            <text x="78" y="85" text-anchor="middle" fill="#0f7ea8" font-size="4" letter-spacing="1.5" font-family="Consolas, monospace" opacity="0.75">CYBER HQ PIVOT</text>
            <circle cx="150" cy="89" r="1" fill="#3ee0ff" opacity="0.9"/>
          </g>

          <!-- soft ambient underglow behind the monitor row (bloom on the wall) -->
          <ellipse cx="360" cy="240" rx="340" ry="30" fill="#0a4d70" opacity="0.18" filter="url(#glow-strong)"/>
        </g>

        <!-- desk surface (perspective slab) -->
        <g id="desk" filter="url(#glow-soft)">
          <path d="M 120 340 L 600 340 L 640 370 L 80 370 Z" fill="#031824" stroke="#0f7ea8" stroke-width="1.2"/>
          <path d="M 80 370 L 640 370 L 640 380 L 80 380 Z" fill="#010b14" stroke="#0a4d70" stroke-width="0.8"/>

          <!-- keyboard -->
          <g transform="translate(280 344)">
            <rect x="0" y="0" width="160" height="18" rx="1" fill="#02141f" stroke="#12b5e5" stroke-width="0.8"/>
            <g fill="#0f7ea8" opacity="0.55">
              <rect x="6"   y="3" width="10" height="3"/>
              <rect x="18"  y="3" width="10" height="3"/>
              <rect x="30"  y="3" width="10" height="3"/>
              <rect x="42"  y="3" width="10" height="3"/>
              <rect x="54"  y="3" width="10" height="3"/>
              <rect x="66"  y="3" width="10" height="3"/>
              <rect x="78"  y="3" width="10" height="3"/>
              <rect x="90"  y="3" width="10" height="3"/>
              <rect x="102" y="3" width="10" height="3"/>
              <rect x="114" y="3" width="10" height="3"/>
              <rect x="126" y="3" width="10" height="3"/>
              <rect x="138" y="3" width="10" height="3"/>
              <rect x="6"   y="8" width="10" height="3"/>
              <rect x="18"  y="8" width="10" height="3"/>
              <rect x="30"  y="8" width="10" height="3"/>
              <rect x="42"  y="8" width="10" height="3"/>
              <rect x="54"  y="8" width="10" height="3"/>
              <rect x="66"  y="8" width="10" height="3"/>
              <rect x="78"  y="8" width="10" height="3"/>
              <rect x="90"  y="8" width="10" height="3"/>
              <rect x="102" y="8" width="10" height="3"/>
              <rect x="114" y="8" width="10" height="3"/>
              <rect x="126" y="8" width="10" height="3"/>
              <rect x="30"  y="13" width="100" height="3"/>
            </g>
          </g>

          <!-- mouse -->
          <ellipse cx="470" cy="353" rx="9" ry="6" fill="#02141f" stroke="#12b5e5" stroke-width="0.8"/>
        </g>

        <!-- WIREFRAME OPERATOR: back view (viewer sees the nape/shoulders/spine, arms reach forward to keyboard) -->
        <g id="operator" filter="url(#glow-strong)" stroke="#12b5e5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g class="op-body" stroke-width="1.4">

            <!-- head (back of skull) -->
            <ellipse cx="360" cy="248" rx="26" ry="30" stroke="#3ee0ff"/>
            <!-- crown seam (parting) down back of head -->
            <path d="M 360 220 L 360 274" stroke-width="0.9" opacity="0.8"/>
            <!-- hairline at nape (curved arc at bottom back) -->
            <path d="M 340 268 Q 360 274 380 268" stroke-width="1" opacity="0.9"/>
            <!-- ears (side stubs, visible from behind) -->
            <path d="M 334 246 Q 331 251 334 256"/>
            <path d="M 386 246 Q 389 251 386 256"/>

            <!-- neck (two verticals from back-of-skull to shoulders) -->
            <line x1="350" y1="274" x2="346" y2="292"/>
            <line x1="370" y1="274" x2="374" y2="292"/>

            <!-- shoulder line (broad, drapes down from neck to arms) -->
            <path d="M 288 314 Q 360 292 432 314"/>

            <!-- upper back: two shoulder blades -->
            <path d="M 304 322 L 328 350 L 344 322 Z" opacity="0.7"/>
            <path d="M 416 322 L 392 350 L 376 322 Z" opacity="0.7"/>

            <!-- spine down center of back -->
            <line x1="360" y1="292" x2="360" y2="360"/>

            <!-- torso outline (back / lats) -->
            <path d="M 288 314 Q 306 344 318 372"/>
            <path d="M 432 314 Q 414 344 402 372"/>
            <!-- waistline -->
            <path d="M 318 372 L 402 372" opacity="0.75"/>

            <!-- horizontal wireframe cross-strap (belt line hint) -->
            <path d="M 300 340 Q 360 348 420 340" opacity="0.55"/>

            <!-- LEFT arm reaching forward (viewer's left = operator's right side of body from behind) -->
            <path d="M 288 314 Q 258 336 270 360 Q 288 372 316 366"/>
            <!-- RIGHT arm reaching forward -->
            <path d="M 432 314 Q 462 336 450 360 Q 432 372 404 366"/>

            <!-- hands hovering above keyboard -->
            <circle cx="316" cy="366" r="6"/>
            <circle cx="404" cy="366" r="6"/>

            <!-- chair back rising behind operator's back -->
            <path d="M 282 320 L 278 390" stroke-width="1"/>
            <path d="M 438 320 L 442 390" stroke-width="1"/>
            <path d="M 278 390 L 442 390" stroke-width="1"/>
            <!-- chair headrest hint peeking above shoulders -->
            <path d="M 322 296 Q 360 288 398 296" stroke-width="1" opacity="0.55"/>
          </g>
        </g>

        <!-- floor grid perspective -->
        <g id="floor" stroke="#0a3a55" stroke-width="0.6" fill="none" opacity="0.5">
          <path d="M 0 400 L 720 400"/>
          <path d="M 0 420 L 720 420"/>
          <path d="M 0 440 L 720 440"/>
          <path d="M 60 400 L -20 456"/>
          <path d="M 180 400 L 140 456"/>
          <path d="M 300 400 L 280 456"/>
          <path d="M 420 400 L 440 456"/>
          <path d="M 540 400 L 580 456"/>
          <path d="M 660 400 L 740 456"/>
        </g>

      </svg>
    </div>

    <div id="controls">
      <button data-state="idle" class="active">Idle</button>
      <button data-state="listening">Listen</button>
      <button data-state="thinking">Think</button>
      <button data-state="speaking">Speak</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
