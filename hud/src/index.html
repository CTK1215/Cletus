<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ws://127.0.0.1:8765; img-src 'self' data:">
  <title>Cletus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-idle">
  <div id="hud">
    <div id="drag-region"></div>
    <div id="state-label">IDLE</div>
    <div id="voice-status" class="offline" title="Voice service offline">● VOICE</div>
    <div id="followup" class="hidden" title="Mic is open, just talk">● GO AHEAD <span id="followup-count"></span></div>
    <div id="mute-badge" class="hidden" title="Sounds muted (M)">MUTED</div>
    <button id="close-btn" title="Close">×</button>

    <div id="dialog">
      <div id="you-said" class="line"></div>
      <div id="cletus-said" class="line"></div>
    </div>

    <div id="image-screen" class="hidden">
      <img id="image-el" alt="">
      <div id="image-caption"></div>
    </div>

    <div id="scene">
      <svg viewBox="0 0 720 456" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

        <defs>
          <!-- room atmosphere -->
          <radialGradient id="room-glow" cx="50%" cy="38%" r="80%">
            <stop offset="0%"   stop-color="#0a2c46"/>
            <stop offset="45%"  stop-color="#051423"/>
            <stop offset="100%" stop-color="#01050b"/>
          </radialGradient>
          <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
            <stop offset="50%"  stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.78"/>
          </radialGradient>

          <!-- ceiling -->
          <linearGradient id="ceil-face" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0b1620"/>
            <stop offset="100%" stop-color="#040a12"/>
          </linearGradient>
          <linearGradient id="rail-amber" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#7a4a14" stop-opacity="0.1"/>
            <stop offset="18%"  stop-color="#ffb347" stop-opacity="0.9"/>
            <stop offset="50%"  stop-color="#ffd9a0"/>
            <stop offset="82%"  stop-color="#ffb347" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#7a4a14" stop-opacity="0.1"/>
          </linearGradient>

          <!-- screens -->
          <linearGradient id="screen-face" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#08202f"/>
            <stop offset="55%"  stop-color="#051726"/>
            <stop offset="100%" stop-color="#03101d"/>
          </linearGradient>
          <linearGradient id="screen-sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#bfe9ff" stop-opacity="0.14"/>
            <stop offset="28%"  stop-color="#bfe9ff" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="#bfe9ff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="center-halo" cx="50%" cy="50%" r="60%">
            <stop offset="0%"   stop-color="#3ee0ff" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#3ee0ff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#3ee0ff" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#3ee0ff" stop-opacity="0"/>
          </linearGradient>

          <!-- desk -->
          <linearGradient id="desk-face" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0d1d2b"/>
            <stop offset="30%"  stop-color="#071320"/>
            <stop offset="100%" stop-color="#030910"/>
          </linearGradient>
          <linearGradient id="pad-glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0e3a54"/>
            <stop offset="100%" stop-color="#062032"/>
          </linearGradient>

          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-big" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

            <circle cx="2.3" cy="2.3" r="1" fill="#7fd6f2"/>
          </pattern>

            <line class="s-rule" x1="0" y1="51" x2="90" y2="51"/>

            <line class="s-rule" x1="0" y1="64" x2="90" y2="64"/>
            <text class="s-key" x="0" y="73">REVENUECAT</text><text class="s-val nofeed" x="90" y="73" text-anchor="end">—</text>
          </g>

          <!-- greeked fine print -->
          <g class="greek" transform="translate(110 118)">
            <rect x="0" y="0"  width="84" height="2"/><rect x="0" y="5"  width="66" height="2"/>
            <rect x="0" y="10" width="90" height="2"/><rect x="0" y="15" width="52" height="2"/>
            <rect x="0" y="20" width="78" height="2"/><rect x="0" y="25" width="61" height="2"/>
            <rect x="0" y="30" width="88" height="2"/>
          </g>
          <text class="s-foot" x="10" y="166">FEED OFFLINE · PHASE B WIRES LIVE DATA</text>

          <g class="ruler" stroke-width="0.7">
            <line x1="204" y1="34" x2="204" y2="152"/>
            <line x1="202" y1="44" x2="204" y2="44"/><line x1="202" y1="64" x2="204" y2="64"/>

        <g class="panel wallscreen" transform="translate(482 90) skewY(3)">

          <rect x="0" y="0" width="208" height="172" rx="3" fill="url(#screen-face)"/>
